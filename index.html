<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orquídeas para Cintia</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100%;
  min-height: 100svh;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

.scene {
  position: relative;
  width: 100%;
  min-height: 100svh;
  background:
    radial-gradient(circle at bottom, rgba(0,0,0,.25), rgba(0,0,0,.6)),
    url("bosque.jpg");
  background-size: cover;
  background-position: center bottom;
  background-repeat: no-repeat;
  overflow: hidden;
}

.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top, rgba(0,0,0,.15), rgba(0,0,0,.45));
  z-index: 0;
}

/* TEXTO */
.dedication {
  position: absolute;
  top: 6%;
  width: 100%;
  text-align: center;
  z-index: 50;
}

.dedication .title {
  font-family: 'Great Vibes', cursive;
  font-size: 56px;
  color: #ffd36a;
  text-shadow: 0 0 15px rgba(255,200,80,0.8);
}

.dedication .phrase {
  font-family: 'Great Vibes', cursive;
  font-size: 32px;
  color: #ffe8b0;
  margin-top: 10px;
  opacity: 0;
  transform: translateY(25px);
  animation: showPhrase 3s ease forwards;
  animation-delay: 7s;
}

@keyframes showPhrase {
  to { opacity: 1; transform: translateY(0); }
}

/* ORQUÍDEAS */
.orchid {
  position: absolute;
  bottom: -60px;
  width: 260px;
  height: 650px;
  z-index: 5;
}

.o1 { left: 50%; transform: translateX(-50%) scale(1); z-index: 20; }
.o2 { left: 22%; transform: scale(0.85); z-index: 15; }
.o3 { right: 22%; transform: scale(0.85); z-index: 15; }
.o4 { left: 5%; transform: scale(0.7); z-index: 10; }
.o5 { right: 5%; transform: scale(0.7); z-index: 10; }

/* TALLO */
.stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 12px;
  height: 600px;
  background: linear-gradient(to top, #0b3b1e, #1bbf6b);
  border-radius: 20px;
  transform-origin: bottom;
  transform: translateX(-50%) scaleY(0);
  animation: growStem 2.2s ease-out forwards;
}

@keyframes growStem {
  to { transform: translateX(-50%) scaleY(1); }
}

/* FLORES (sin cambios internos) */
.flower-wrapper {
  position: absolute;
  width: 220px;
  height: 220px;
  opacity: 0;
  transform: scale(0);
  animation: bloom 1.2s ease-out forwards;
}

@keyframes bloom {
  to { opacity: 1; transform: scale(1); }
}

/* LUCIÉRNAGAS */
.firefly {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff6a0, #ffd700, transparent);
  box-shadow: 0 0 12px gold;
  opacity: 0;
  animation: fly linear infinite, glow 3s infinite;
  pointer-events: none;
  z-index: 40;
}

@keyframes glow { 50% { opacity: 1; } }
@keyframes fly { to { transform: translate(var(--x), var(--y)); } }

/* 📱 RESPONSIVE REAL */
@media (max-width: 768px) {

  .dedication .title {
    font-size: 38px;
  }

  .dedication .phrase {
    font-size: 22px;
    padding: 0 16px;
  }

  .orchid {
    width: 90vw;
    max-width: 200px;
    height: auto;
    bottom: auto;
    top: 38vh;
  }

  .o4, .o5 {
    display: none;
  }
}
</style>
</head>

<body>
<div class="scene">

  <div class="dedication">
    <div class="title">Para Cintia</div>
    <div class="phrase">
      “Hay flores que iluminan el jardín,<br>
      pero tú eres la que me alegra el alma.”
    </div>
  </div>

  <div class="orchid o1"></div>
  <div class="orchid o2"></div>
  <div class="orchid o3"></div>
  <div class="orchid o4"></div>
  <div class="orchid o5"></div>

</div>

<script>
document.querySelectorAll('.orchid').forEach(o => {
  o.innerHTML = `
    <div class="stem"></div>
    <div class="branch b1"></div>
    <div class="branch b2"></div>
    <div class="branch b3"></div>
    <div class="branch b4"></div>
    ${[1,2,3,4].map(i=>`
      <div class="flower-wrapper f${i}">
        <div class="flower">
          <div class="petal top"></div>
          <div class="petal left"></div>
          <div class="petal right"></div>
          <div class="center"></div>
        </div>
      </div>`).join('')}
  `;
});

const scene = document.querySelector('.scene');
setInterval(() => {
  if (document.querySelectorAll('.firefly').length > 60) return;
  const f = document.createElement('div');
  f.className = 'firefly';
  f.style.left = Math.random() * innerWidth + 'px';
  f.style.top = Math.random() * innerHeight + 'px';
  f.style.setProperty('--x', (Math.random() * 200 - 100) + 'px');
  f.style.setProperty('--y', (-Math.random() * 200) + 'px');
  f.style.animationDuration = `${12 + Math.random() * 6}s`;
  scene.appendChild(f);
  setTimeout(() => f.remove(), 18000);
}, 80);
</script>

</body>
</html>
