<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orquídeas para Cintia</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 100%;
  min-height: 100vh;
  background: black;
  font-family: Arial, sans-serif;
}

/* 🌲 ESCENA */
.scene {
  position: relative;
  width: 100%;
  min-height: 100vh;
  background:
    radial-gradient(circle at bottom, rgba(0,0,0,.25), rgba(0,0,0,.6)),
    url("bosque.jpg");
  background-size: cover;
  background-position: center bottom;
  background-repeat: no-repeat;
  overflow-x: hidden;
}

/* sombreado */
.scene::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at top, rgba(0,0,0,.15), rgba(0,0,0,.45));
  z-index: 0;
}

/* TEXTO */
.dedication {
  position: relative;
  padding-top: 6vh;
  text-align: center;
  z-index: 50;
  padding-inline: 16px;
}

.dedication .title {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(36px, 7vw, 56px);
  color: #ffd36a;
  text-shadow: 0 0 15px rgba(255,200,80,0.8);
}

.dedication .phrase {
  font-family: 'Great Vibes', cursive;
  font-size: clamp(20px, 4.5vw, 32px);
  color: #ffe8b0;
  margin-top: 10px;
  opacity: 0;
  transform: translateY(25px);
  animation: showPhrase 3s ease forwards;
  animation-delay: 7s;
}

@keyframes showPhrase {
  to { opacity: 1; transform: translateY(0); }
}

/* CONTENEDOR ORQUÍDEAS */
.orchids {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  gap: 2vw;
  padding-bottom: 10vh;
  z-index: 5;
}

/* ORQUÍDEA */
.orchid {
  width: min(260px, 60vw);
  height: 650px;
  position: relative;
}

/* ESCALAS PC */
.o1 { transform: scale(1); }
.o2, .o3 { transform: scale(0.85); }
.o4, .o5 { transform: scale(0.7); opacity: .8; }

/* TALLO */
.stem {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 10px;
  height: 100%;
  background: linear-gradient(to top, #0b3b1e, #1bbf6b);
  border-radius: 20px;
  transform: translateX(-50%) scaleY(0);
  transform-origin: bottom;
  animation: growStem 2.2s ease-out forwards;
}

@keyframes growStem {
  to { transform: translateX(-50%) scaleY(1); }
}

/* HOJAS */
.leaves {
  position: absolute;
  bottom: 0;
  left: 50%;
  width: 100%;
  height: 120px;
  transform: translateX(-50%);
}

.leaf {
  position: absolute;
  bottom: 0;
  width: 50%;
  height: 80px;
  background: linear-gradient(to top right, rgba(0,255,160,0.3), rgba(0,120,60,0.95));
  border-radius: 80% 20% 70% 30%;
  box-shadow: 0 0 18px rgba(0,255,160,0.4);
  transform: scale(0);
  transform-origin: bottom;
  animation: growLeaf 1.2s ease-out forwards;
  animation-delay: 2s;
}

.leaf.left { left: 0; transform: rotate(-25deg) scale(0); }
.leaf.right { right: 0; transform: rotate(25deg) scale(0); }

@keyframes growLeaf {
  to { transform: rotate(var(--r,0deg)) scale(1); }
}

/* RAMAS */
.branch {
  position: absolute;
  width: 30%;
  height: 6px;
  background: linear-gradient(to right, #0b3b1e, #1bbf6b);
  border-radius: 20px;
  transform: scaleX(0);
  transform-origin: left;
  opacity: 0;
  animation: growBranch .8s ease-out forwards;
}

@keyframes growBranch {
  to { transform: scaleX(1); opacity: 1; }
}

.b1 { top: 15%; left: 52%; transform: rotate(-20deg); animation-delay: 2.2s; }
.b2 { top: 30%; left: 50%; transform: rotate(20deg); animation-delay: 2.6s; }
.b3 { top: 45%; left: 52%; transform: rotate(-18deg); animation-delay: 3s; }
.b4 { top: 60%; left: 50%; transform: rotate(15deg); animation-delay: 3.4s; }

/* FLORES */
.flower-wrapper {
  position: absolute;
  width: 70%;
  aspect-ratio: 1;
  opacity: 0;
  transform: scale(0);
  animation: bloom 1.2s ease-out forwards;
}

@keyframes bloom {
  to { opacity: 1; transform: scale(1); }
}

.f1 { top: 5%; left: -15%; animation-delay: 2.4s; }
.f2 { top: 25%; right: -18%; animation-delay: 2.8s; }
.f3 { top: 45%; left: -15%; animation-delay: 3.2s; }
.f4 { top: 65%; right: -18%; animation-delay: 3.6s; }

/* FLOR */
.flower {
  width: 100%;
  height: 100%;
  position: relative;
  animation: float 4s ease-in-out infinite;
}

@keyframes float {
  50% { transform: translateY(-10px); }
}

.petal {
  position: absolute;
  width: 55%;
  height: 70%;
  background: radial-gradient(circle at 30% 30%, #fff, #9c2cff, #00c8ff);
  border-radius: 60% 40% 50% 50%;
}

.petal.top { top: -5%; left: 50%; transform: translateX(-50%); }
.petal.left { top: 25%; left: 0; transform: rotate(-20deg); }
.petal.right { top: 25%; right: 0; transform: rotate(20deg); }

.center {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 25%;
  height: 25%;
  background: radial-gradient(circle, #ffe066, #ff8800);
  border-radius: 50%;
}

/* LUCIÉRNAGAS */
.firefly {
  position: absolute;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: radial-gradient(circle, #fff6a0, #ffd700, transparent);
  box-shadow: 0 0 12px gold;
  opacity: 0;
  animation: fly linear infinite, glow 3s infinite;
  pointer-events: none;
  z-index: 40;
}

@keyframes glow { 50% { opacity: 1; } }
@keyframes fly { to { transform: translate(var(--x), var(--y)); } }

/* 📱 CELULAR */
@media (max-width: 768px) {
  .orchids {
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .orchid {
    transform: scale(.75) !important;
  }
}
</style>
</head>

<body>
<div class="scene">

  <div class="dedication">
    <div class="title">Para Cintia</div>
    <div class="phrase">
      “Hay flores que iluminan el jardín,<br>
      pero tú eres la que me alegra el alma.”
    </div>
  </div>

  <div class="orchids">
    <div class="orchid o1"></div>
    <div class="orchid o2"></div>
    <div class="orchid o3"></div>
    <div class="orchid o4"></div>
    <div class="orchid o5"></div>
  </div>

</div>

<script>
document.querySelectorAll('.orchid').forEach(o => {
  o.innerHTML = `
    <div class="stem"></div>
    <div class="leaves">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>
    <div class="branch b1"></div>
    <div class="branch b2"></div>
    <div class="branch b3"></div>
    <div class="branch b4"></div>
    ${[1,2,3,4].map(i=>`
      <div class="flower-wrapper f${i}">
        <div class="flower">
          <div class="petal top"></div>
          <div class="petal left"></div>
          <div class="petal right"></div>
          <div class="center"></div>
        </div>
      </div>`).join('')}
  `;
});

const scene = document.querySelector('.scene');
setInterval(()=>{
  if(document.querySelectorAll('.firefly').length > 120) return;
  const f = document.createElement('div');
  f.className = 'firefly';
  f.style.left = Math.random()*innerWidth + 'px';
  f.style.top = Math.random()*innerHeight + 'px';
  f.style.setProperty('--x',(Math.random()*200-100)+'px');
  f.style.setProperty('--y',(-Math.random()*200)+'px');
  f.style.animationDuration = `${12+Math.random()*6}s`;
  scene.appendChild(f);
  setTimeout(()=>f.remove(),18000);
},60);
</script>

</body>
</html>
